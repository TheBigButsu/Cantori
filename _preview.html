<!doctype html><meta charset=utf-8><style>
body{background:#14100a;margin:0;font-family:monospace;color:#ece2cf}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;padding:20px}
.c{text-align:center}
img{width:64px;height:64px;image-rendering:pixelated;background:#241c12;border-radius:6px}
span{display:block;font-size:11px;margin-top:5px;color:#a2947a}
</style><div class="grid" id="g"></div><script>
const names=['player','rat','bat','snake','spider','dagger','sword','mace','leather','chain','plate','potion','scroll','stairs','floor','wall'];
g.innerHTML=names.map(n=>`<div class=c><img src="./assets/tiles/${n}.png"><span>${n}</span></div>`).join('');
</script>
