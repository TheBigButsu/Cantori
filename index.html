<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cantori</title>
  <meta name="description" content="A permadeath roguelike dungeon crawler you can play in your browser.">

  <!-- Home-screen install (Android + iOS) -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0e0b07">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cantori">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <span class="mark">CANTORI</span>
      <span class="depth" id="depthLabel">Depth&nbsp;1</span>
    </header>

    <div id="stage">
      <canvas id="game"></canvas>
    </div>

    <footer id="hint">
      <span>Explore the dungeon · step on the <b>&gt;</b> stairs to go deeper</span>
      <span class="sep">·</span>
      <span>tap to walk · arrows / WASD · diagonals Y U B N</span>
    </footer>
  </div>

  <script src="./game.js"></script>
</body>
</html>
